# Stack Swarm do worker do swipe file. Colar em Portainer > Stacks > Add stack (Web editor),
# nome da stack: swipe. As variáveis vão na seção "Environment variables" do Portainer.
version: "3.8"

services:
  swipe_worker:
    # Imagem construída no próprio Docker da VPS (Portainer > Images > Build a new image).
    # O repositório é privado, então não publicamos a imagem no GHCR; o Actions segue rodando os
    # testes a cada push, e o nó é único, então a imagem local basta para o Swarm.
    image: swipe-worker:latest
    environment:
      PORTA: "8080"
      SUPABASE_URL: "https://bnpvzguapunsztsdvmrs.supabase.co"
      # Chave pública do app (a mesma do front): o worker só lê o status do job para perceber a pausa
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJucHZ6Z3VhcHVuc3p0c2R2bXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MTM3NzIsImV4cCI6MjA5Mjk4OTc3Mn0.2JNYq2-Ra5Na0kIUJtEnpER1IK7uBg6mhsw3IlW6duA"
      SWIPE_KEY: "${SWIPE_KEY}"
      WORKER_KEY: "${WORKER_KEY}"
      # Fireflies (aba Fireflies): chave da API e segredo do webhook, colados na stack pelo usuário
      FIREFLIES_API_KEY: "${FIREFLIES_API_KEY}"
      FIREFLIES_WEBHOOK_SECRET: "${FIREFLIES_WEBHOOK_SECRET}"
      SWIPE_TMP: "/dados/tmp"
      TZ: "America/Sao_Paulo"
    volumes:
      - swipe_tmp:/dados/tmp
    configs:
      - source: swipe_cookies_instagram
        target: /cookies/instagram.txt
        mode: 0444
      - source: swipe_cookies_tiktok
        target: /cookies/tiktok.txt
        mode: 0444
      - source: swipe_cookies_facebook
        target: /cookies/facebook.txt
        mode: 0444
      - source: swipe_cookies_linkedin
        target: /cookies/linkedin.txt
        mode: 0444
      - source: swipe_cookies_youtube_v2
        target: /cookies/youtube.txt
        mode: 0444
    networks:
      - ALDigitalNet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: "2"
          memory: 3G
      placement:
        constraints:
          - node.role == manager

volumes:
  swipe_tmp:

configs:
  swipe_cookies_instagram:
    external: true
  swipe_cookies_tiktok:
    external: true
  swipe_cookies_facebook:
    external: true
  swipe_cookies_linkedin:
    external: true
  swipe_cookies_youtube_v2:
    external: true

networks:
  ALDigitalNet:
    external: true
